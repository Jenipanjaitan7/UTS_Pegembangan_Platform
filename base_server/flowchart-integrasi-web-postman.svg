<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="880" viewBox="0 0 1200 880" role="img" aria-labelledby="title description">
  <title id="title">Diagram Gabungan Web, API, Postman, dan SQLite</title>
  <desc id="description">Web memakai API untuk operasional, Postman memakai API untuk pengujian, dan API mengakses SQLite.</desc>
  <defs>
    <style>
      text { font-family: "Segoe UI", Arial, sans-serif; fill: #18332e; }
      .box { fill: #edf6f2; stroke: #426b62; stroke-width: 2; }
      .api { fill: #e8effb; stroke: #536f9c; stroke-width: 2.5; }
      .db { fill: #fff3d8; stroke: #b1842e; stroke-width: 2; }
      .line { fill: none; stroke: #526e67; stroke-width: 2.4; marker-end: url(#arrow); }
      .response { fill: none; stroke: #7b6399; stroke-width: 2.4; stroke-dasharray: 9 6; marker-end: url(#arrow-purple); }
      .label { font-size: 15px; fill: #526e67; font-weight: 600; }
      .small { font-size: 15px; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#526e67"/>
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7b6399"/>
    </marker>
  </defs>
  <text x="600" y="46" text-anchor="middle" font-size="27" font-weight="700">Integrasi Web dan Pengujian API dengan Postman</text>

  <rect x="50" y="120" width="290" height="180" rx="16" class="box"/>
  <text x="195" y="160" text-anchor="middle" font-size="21" font-weight="700">Aplikasi Web</text>
  <text x="195" y="198" text-anchor="middle" font-size="16">
    <tspan x="195">Petugas mengelola</tspan>
    <tspan x="195" dy="24">pelanggan, layanan, pesanan</tspan>
    <tspan x="195" dy="24">melalui antarmuka</tspan>
  </text>

  <rect x="50" y="500" width="290" height="180" rx="16" class="box"/>
  <text x="195" y="540" text-anchor="middle" font-size="21" font-weight="700">Postman</text>
  <text x="195" y="578" text-anchor="middle" font-size="16">
    <tspan x="195">Mengirim request API</tspan>
    <tspan x="195" dy="24">untuk pengujian manual</tspan>
    <tspan x="195" dy="24">Collection: tambah layanan</tspan>
  </text>

  <rect x="455" y="280" width="300" height="240" rx="18" class="api"/>
  <text x="605" y="325" text-anchor="middle" font-size="23" font-weight="700">Express API</text>
  <text x="605" y="365" text-anchor="middle" font-size="16">
    <tspan x="605">http://localhost:3000/api/laundry</tspan>
    <tspan x="605" dy="30">Validasi data dan</tspan>
    <tspan x="605" dy="24">menangani operasi</tspan>
    <tspan x="605" dy="24">GET, POST, PUT, DELETE</tspan>
  </text>

  <path d="M340 190 C395 190 400 320 455 340" class="line"/>
  <text x="359" y="224" class="label">HTTP request</text>
  <path d="M455 400 C400 420 395 260 340 250" class="response"/>
  <text x="357" y="278" class="label">JSON response</text>

  <path d="M340 560 C395 560 400 480 455 460" class="line"/>
  <text x="354" y="540" class="label">HTTP request</text>
  <path d="M455 485 C400 515 395 620 340 620" class="response"/>
  <text x="355" y="603" class="label">JSON response</text>

  <path d="M755 365 L865 365" class="line"/>
  <text x="775" y="347" class="label">Query / perubahan</text>
  <path d="M865 445 L755 445" class="response"/>
  <text x="785" y="470" class="label">Hasil data</text>

  <rect x="865" y="280" width="285" height="240" rx="18" class="db"/>
  <ellipse cx="1007" cy="325" rx="112" ry="30" fill="#fff9eb" stroke="#b1842e" stroke-width="2"/>
  <path d="M895 325 L895 470 C895 487 945 500 1007 500 C1069 500 1119 487 1119 470 L1119 325" fill="#fff3d8" stroke="#b1842e" stroke-width="2"/>
  <path d="M895 395 C895 412 945 425 1007 425 C1069 425 1119 412 1119 395" fill="none" stroke="#b1842e" stroke-width="2"/>
  <path d="M895 460 C895 477 945 490 1007 490 C1069 490 1119 477 1119 460" fill="none" stroke="#b1842e" stroke-width="2"/>
  <text x="1007" y="374" text-anchor="middle" font-size="22" font-weight="700">SQLite</text>
  <text x="1007" y="414" text-anchor="middle" font-size="16">Pelanggan</text>
  <text x="1007" y="449" text-anchor="middle" font-size="16">Layanan dan pesanan</text>

  <rect x="140" y="755" width="920" height="72" rx="12" fill="#f7faf8" stroke="#d6e3de" stroke-width="1.5"/>
  <text x="600" y="784" text-anchor="middle" font-size="16" font-weight="600">
    <tspan x="600">Web dan Postman adalah dua klien terpisah yang berkomunikasi dengan API.</tspan>
    <tspan x="600" dy="23" class="small">Web untuk operasional; Postman untuk menguji request dan memeriksa respons API.</tspan>
  </text>
</svg>
