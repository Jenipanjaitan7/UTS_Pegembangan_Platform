<svg xmlns="http://www.w3.org/2000/svg" width="1450" height="920" viewBox="0 0 1450 920" role="img" aria-labelledby="title description">
  <title id="title">ERD Sistem Informasi Ruang Laundry</title>
  <desc id="description">ERD berbahasa Indonesia dengan entitas Pelanggan, Layanan, dan Pesanan serta relasi satu ke banyak.</desc>
  <defs>
    <style>
      text { font-family: "Segoe UI", Arial, sans-serif; fill: #18332e; }
      .card { fill: #fff; stroke: #426b62; stroke-width: 2; }
      .head { fill: #173c34; }
      .head-label { fill: #fff; font-size: 21px; font-weight: 700; }
      .table-label { fill: #d7e8e1; font-size: 14px; }
      .field { font-size: 16px; }
      .key { font-weight: 700; fill: #315d52; }
      .meaning { fill: #62766f; font-size: 14px; }
      .rule { stroke: #d6e3de; stroke-width: 1; }
      .connector { fill: none; stroke: #526e67; stroke-width: 2.5; }
      .cardinality { font-size: 18px; font-weight: 700; fill: #315d52; }
      .relationship { fill: #f2f6f4; stroke: #cbd9d4; stroke-width: 1.5; }
      .relationship-text { font-size: 15px; font-weight: 600; fill: #415e55; }
      .legend { fill: #f7faf8; stroke: #d6e3de; stroke-width: 1.5; }
      .legend-text { font-size: 15px; fill: #415e55; }
      .footer { font-size: 14px; fill: #62766f; }
    </style>
  </defs>

  <text x="725" y="52" text-anchor="middle" font-size="30" font-weight="700">ERD — Sistem Informasi Ruang Laundry</text>
  <text x="725" y="83" text-anchor="middle" font-size="16" fill="#62766f">Model data inti berdasarkan skema database pada proyek</text>

  <!-- Relationships are drawn behind the entity cards. -->
  <path d="M420 385 L550 385" class="connector"/>
  <path d="M900 385 L1030 385" class="connector"/>
  <text x="440" y="365" text-anchor="middle" class="cardinality">1</text>
  <text x="530" y="365" text-anchor="middle" class="cardinality">N</text>
  <text x="920" y="365" text-anchor="middle" class="cardinality">N</text>
  <text x="1010" y="365" text-anchor="middle" class="cardinality">1</text>

  <!-- Customer -->
  <g>
    <rect x="70" y="205" width="350" height="360" rx="12" class="card"/>
    <path d="M82 205 H408 Q420 205 420 217 V265 H70 V217 Q70 205 82 205" class="head"/>
    <text x="245" y="238" text-anchor="middle" class="head-label">PELANGGAN</text>
    <text x="245" y="257" text-anchor="middle" class="table-label">Tabel: customers</text>

    <text x="94" y="303" class="field"><tspan class="key">PK  id</tspan><tspan dx="16" class="meaning">ID pelanggan</tspan></text>
    <line x1="90" y1="316" x2="400" y2="316" class="rule"/>
    <text x="94" y="346" class="field">name<tspan dx="16" class="meaning">Nama pelanggan (wajib)</tspan></text>
    <line x1="90" y1="359" x2="400" y2="359" class="rule"/>
    <text x="94" y="389" class="field">phone<tspan dx="16" class="meaning">Nomor telepon (wajib)</tspan></text>
    <line x1="90" y1="402" x2="400" y2="402" class="rule"/>
    <text x="94" y="432" class="field">address<tspan dx="16" class="meaning">Alamat (opsional)</tspan></text>
    <line x1="90" y1="445" x2="400" y2="445" class="rule"/>
    <text x="94" y="475" class="field">created_at<tspan dx="16" class="meaning">Waktu pendaftaran</tspan></text>
  </g>

  <!-- Order -->
  <g>
    <rect x="550" y="155" width="350" height="500" rx="12" class="card"/>
    <path d="M562 155 H888 Q900 155 900 167 V215 H550 V167 Q550 155 562 155" class="head"/>
    <text x="725" y="188" text-anchor="middle" class="head-label">PESANAN</text>
    <text x="725" y="207" text-anchor="middle" class="table-label">Tabel: orders</text>

    <text x="574" y="253" class="field"><tspan class="key">PK  id</tspan><tspan dx="16" class="meaning">ID pesanan</tspan></text>
    <line x1="570" y1="266" x2="880" y2="266" class="rule"/>
    <text x="574" y="296" class="field"><tspan class="key">FK  customer_id</tspan><tspan dx="8" class="meaning">Pelanggan</tspan></text>
    <line x1="570" y1="309" x2="880" y2="309" class="rule"/>
    <text x="574" y="339" class="field"><tspan class="key">FK  service_id</tspan><tspan dx="16" class="meaning">Layanan</tspan></text>
    <line x1="570" y1="352" x2="880" y2="352" class="rule"/>
    <text x="574" y="382" class="field">weight<tspan dx="16" class="meaning">Berat / jumlah (&gt; 0)</tspan></text>
    <line x1="570" y1="395" x2="880" y2="395" class="rule"/>
    <text x="574" y="425" class="field">total_price<tspan dx="16" class="meaning">Total biaya</tspan></text>
    <line x1="570" y1="438" x2="880" y2="438" class="rule"/>
    <text x="574" y="468" class="field">status<tspan dx="16" class="meaning">baru / diproses / selesai</tspan></text>
    <text x="658" y="491" class="meaning">diambil / batal</text>
    <line x1="570" y1="503" x2="880" y2="503" class="rule"/>
    <text x="574" y="533" class="field">notes<tspan dx="16" class="meaning">Catatan (opsional)</tspan></text>
    <line x1="570" y1="546" x2="880" y2="546" class="rule"/>
    <text x="574" y="576" class="field">created_at<tspan dx="16" class="meaning">Waktu dibuat</tspan></text>
    <text x="574" y="615" class="field">updated_at<tspan dx="16" class="meaning">Waktu diperbarui</tspan></text>
  </g>

  <!-- Service -->
  <g>
    <rect x="1030" y="205" width="350" height="400" rx="12" class="card"/>
    <path d="M1042 205 H1368 Q1380 205 1380 217 V265 H1030 V217 Q1030 205 1042 205" class="head"/>
    <text x="1205" y="238" text-anchor="middle" class="head-label">LAYANAN</text>
    <text x="1205" y="257" text-anchor="middle" class="table-label">Tabel: services</text>

    <text x="1054" y="303" class="field"><tspan class="key">PK  id</tspan><tspan dx="16" class="meaning">ID layanan</tspan></text>
    <line x1="1050" y1="316" x2="1360" y2="316" class="rule"/>
    <text x="1054" y="346" class="field">name<tspan dx="16" class="meaning">Nama layanan</tspan></text>
    <line x1="1050" y1="359" x2="1360" y2="359" class="rule"/>
    <text x="1054" y="389" class="field">description<tspan dx="16" class="meaning">Deskripsi (opsional)</tspan></text>
    <line x1="1050" y1="402" x2="1360" y2="402" class="rule"/>
    <text x="1054" y="432" class="field">price_per_kg<tspan dx="16" class="meaning">Tarif layanan</tspan></text>
    <line x1="1050" y1="445" x2="1360" y2="445" class="rule"/>
    <text x="1054" y="475" class="field">unit<tspan dx="16" class="meaning">Satuan: kg / set / buah</tspan></text>
    <line x1="1050" y1="488" x2="1360" y2="488" class="rule"/>
    <text x="1054" y="518" class="field">estimated_days<tspan dx="16" class="meaning">Estimasi hari</tspan></text>
    <line x1="1050" y1="531" x2="1360" y2="531" class="rule"/>
    <text x="1054" y="561" class="field">is_active<tspan dx="16" class="meaning">Status aktif (0 / 1)</tspan></text>
    <text x="1054" y="589" class="meaning">created_at — waktu data dibuat</text>
  </g>

  <!-- Relationship labels -->
  <rect x="115" y="615" width="455" height="72" rx="10" class="relationship"/>
  <text x="342" y="642" text-anchor="middle" class="relationship-text">
    <tspan x="342">Satu pelanggan dapat memiliki banyak pesanan.</tspan>
    <tspan x="342" dy="23">Setiap pesanan dimiliki oleh satu pelanggan.</tspan>
  </text>

  <rect x="830" y="615" width="455" height="72" rx="10" class="relationship"/>
  <text x="1057" y="642" text-anchor="middle" class="relationship-text">
    <tspan x="1057">Satu layanan dapat dipakai di banyak pesanan.</tspan>
    <tspan x="1057" dy="23">Setiap pesanan memilih satu layanan.</tspan>
  </text>

  <rect x="210" y="730" width="1030" height="70" rx="10" class="legend"/>
  <text x="725" y="758" text-anchor="middle" class="legend-text">
    <tspan x="725"><tspan font-weight="700">PK</tspan> = Primary Key (kunci utama)  ·  <tspan font-weight="700">FK</tspan> = Foreign Key (kunci penghubung)</tspan>
    <tspan x="725" dy="24">1:N berarti satu data pada tabel pertama dapat berhubungan dengan banyak data pada tabel kedua.</tspan>
  </text>

  <text x="725" y="842" text-anchor="middle" class="footer">Fokus diagram: tabel operasional laundry. Tabel products, app_migrations, dan test_logs juga ada di skema, tetapi tidak menjadi bagian relasi pesanan laundry.</text>
</svg>
