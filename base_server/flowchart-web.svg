<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1820" viewBox="0 0 1200 1820" role="img" aria-labelledby="title description">
  <title id="title">Flowchart Alur Web Ruang Laundry</title>
  <desc id="description">Alur pengguna mengakses web, memuat data melalui API, lalu melihat atau mengelola data laundry.</desc>
  <defs>
    <style>
      text { font-family: "Segoe UI", Arial, sans-serif; fill: #18332e; }
      .lane { fill: #f7faf8; stroke: #d6e3de; stroke-width: 1.5; }
      .process { fill: #e8f3ef; stroke: #426b62; stroke-width: 2; }
      .decision { fill: #fff3d8; stroke: #b1842e; stroke-width: 2; }
      .terminal { fill: #173c34; stroke: #173c34; stroke-width: 2; }
      .terminal-text { fill: #fff; font-weight: 700; }
      .error { fill: #fff0ed; stroke: #bd6655; stroke-width: 2; }
      .line { fill: none; stroke: #526e67; stroke-width: 2.2; marker-end: url(#arrow); }
      .label { font-size: 15px; fill: #526e67; font-weight: 600; }
      .small { font-size: 15px; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#526e67"/>
    </marker>
  </defs>

  <text x="600" y="42" text-anchor="middle" font-size="28" font-weight="700">Flowchart Alur Web Ruang Laundry</text>
  <rect x="35" y="72" width="1130" height="1720" rx="18" class="lane"/>

  <ellipse cx="600" cy="118" rx="95" ry="28" class="terminal"/>
  <text x="600" y="124" text-anchor="middle" class="terminal-text" font-size="17">Mulai</text>

  <rect x="455" y="166" width="290" height="58" rx="12" class="process"/>
  <text x="600" y="202" text-anchor="middle" font-size="17" font-weight="600">Buka halaman web</text>
  <path d="M600 146 L600 166" class="line"/>

  <rect x="395" y="254" width="410" height="76" rx="12" class="process"/>
  <text x="600" y="282" text-anchor="middle" font-size="17" font-weight="600">
    <tspan x="600">Muat pelanggan, layanan, dan pesanan</tspan>
    <tspan x="600" dy="24" class="small">GET /api/laundry/customers, /services, /orders</tspan>
  </text>
  <path d="M600 224 L600 254" class="line"/>

  <rect x="440" y="360" width="320" height="64" rx="12" class="process"/>
  <text x="600" y="386" text-anchor="middle" font-size="17" font-weight="600">
    <tspan x="600">API menerima permintaan</tspan><tspan x="600" dy="22" class="small">dan membaca data</tspan>
  </text>
  <path d="M600 330 L600 360" class="line"/>

  <rect x="455" y="454" width="290" height="58" rx="12" class="process"/>
  <text x="600" y="489" text-anchor="middle" font-size="17" font-weight="600">SQLite mengembalikan data</text>
  <path d="M600 424 L600 454" class="line"/>

  <rect x="440" y="542" width="320" height="64" rx="12" class="process"/>
  <text x="600" y="568" text-anchor="middle" font-size="17" font-weight="600">
    <tspan x="600">API mengirim respons JSON</tspan><tspan x="600" dy="22" class="small">ke web</tspan>
  </text>
  <path d="M600 512 L600 542" class="line"/>

  <polygon points="600,632 690,682 600,732 510,682" class="decision"/>
  <text x="600" y="688" text-anchor="middle" font-size="16" font-weight="600">Respons berhasil?</text>
  <path d="M600 606 L600 632" class="line"/>

  <rect x="825" y="652" width="270" height="60" rx="12" class="error"/>
  <text x="960" y="688" text-anchor="middle" font-size="16" font-weight="600">Tampilkan pesan kesalahan</text>
  <path d="M690 682 L825 682" class="line"/>
  <text x="740" y="666" class="label">Tidak</text>

  <rect x="455" y="770" width="290" height="62" rx="12" class="process"/>
  <text x="600" y="796" text-anchor="middle" font-size="17" font-weight="600">
    <tspan x="600">Tampilkan ringkasan</tspan><tspan x="600" dy="22" class="small">dan tabel data</tspan>
  </text>
  <path d="M600 732 L600 770" class="line"/>
  <text x="615" y="755" class="label">Ya</text>

  <polygon points="600,858 710,918 600,978 490,918" class="decision"/>
  <text x="600" y="924" text-anchor="middle" font-size="16" font-weight="600">Pilih aksi di web</text>
  <path d="M600 832 L600 858" class="line"/>

  <rect x="75" y="1030" width="275" height="78" rx="12" class="process"/>
  <text x="212" y="1059" text-anchor="middle" font-size="16" font-weight="600">
    <tspan x="212">Lihat / cari data</tspan><tspan x="212" dy="23" class="small">atau filter status pesanan</tspan>
  </text>
  <path d="M490 918 L212 918 L212 1030" class="line"/>
  <text x="354" y="905" class="label">Lihat</text>

  <rect x="462" y="1030" width="276" height="78" rx="12" class="process"/>
  <text x="600" y="1059" text-anchor="middle" font-size="16" font-weight="600">
    <tspan x="600">Tambah / ubah data</tspan><tspan x="600" dy="23" class="small">isi dan simpan formulir</tspan>
  </text>
  <path d="M600 978 L600 1030" class="line"/>
  <text x="615" y="1009" class="label">Tambah / ubah</text>

  <rect x="850" y="1030" width="275" height="78" rx="12" class="process"/>
  <text x="987" y="1059" text-anchor="middle" font-size="16" font-weight="600">
    <tspan x="987">Hapus data</tspan><tspan x="987" dy="23" class="small">konfirmasi penghapusan</tspan>
  </text>
  <path d="M710 918 L987 918 L987 1030" class="line"/>
  <text x="850" y="905" class="label">Hapus</text>

  <rect x="75" y="1150" width="275" height="58" rx="12" class="terminal"/>
  <text x="212" y="1186" text-anchor="middle" class="terminal-text" font-size="16">Tampilan diperbarui</text>
  <path d="M212 1108 L212 1150" class="line"/>
  <path d="M212 1208 L212 1240 L390 1240 L390 918 L490 918" class="line"/>
  <text x="224" y="1232" class="label">Kembali ke pilihan aksi</text>

  <rect x="462" y="1150" width="276" height="58" rx="12" class="process"/>
  <text x="600" y="1174" text-anchor="middle" font-size="16" font-weight="600">
    <tspan x="600">Kirim POST atau PUT</tspan><tspan x="600" dy="21" class="small">ke API</tspan>
  </text>
  <path d="M600 1108 L600 1150" class="line"/>

  <rect x="850" y="1150" width="275" height="58" rx="12" class="process"/>
  <text x="987" y="1174" text-anchor="middle" font-size="16" font-weight="600">
    <tspan x="987">Kirim DELETE</tspan><tspan x="987" dy="21" class="small">ke API</tspan>
  </text>
  <path d="M987 1108 L987 1150" class="line"/>

  <path d="M600 1208 L600 1275"/>
  <path d="M987 1208 L987 1245 L600 1245 L600 1275" class="line"/>
  <rect x="430" y="1275" width="340" height="64" rx="12" class="process"/>
  <text x="600" y="1301" text-anchor="middle" font-size="16" font-weight="600">
    <tspan x="600">API memvalidasi permintaan</tspan><tspan x="600" dy="22" class="small">dan memproses perubahan</tspan>
  </text>

  <polygon points="600,1370 685,1418 600,1466 515,1418" class="decision"/>
  <text x="600" y="1424" text-anchor="middle" font-size="16" font-weight="600">Valid?</text>
  <path d="M600 1339 L600 1370" class="line"/>

  <rect x="825" y="1388" width="280" height="60" rx="12" class="error"/>
  <text x="965" y="1413" text-anchor="middle" font-size="16" font-weight="600">
    <tspan x="965">Tampilkan pesan kesalahan</tspan><tspan x="965" dy="20" class="small">input / server / data terkait</tspan>
  </text>
  <path d="M685 1418 L825 1418" class="line"/>
  <text x="732" y="1402" class="label">Tidak</text>

  <rect x="430" y="1490" width="340" height="62" rx="12" class="process"/>
  <text x="600" y="1516" text-anchor="middle" font-size="16" font-weight="600">
    <tspan x="600">Simpan atau hapus data</tspan><tspan x="600" dy="21" class="small">di SQLite</tspan>
  </text>
  <path d="M600 1466 L600 1490" class="line"/>
  <text x="615" y="1481" class="label">Ya</text>

  <rect x="430" y="1580" width="340" height="62" rx="12" class="process"/>
  <text x="600" y="1606" text-anchor="middle" font-size="16" font-weight="600">
    <tspan x="600">Web menampilkan notifikasi</tspan><tspan x="600" dy="21" class="small">berhasil</tspan>
  </text>
  <path d="M600 1552 L600 1580" class="line"/>

  <rect x="430" y="1670" width="340" height="62" rx="12" class="process"/>
  <text x="600" y="1696" text-anchor="middle" font-size="16" font-weight="600">
    <tspan x="600">Muat ulang data melalui GET</tspan><tspan x="600" dy="21" class="small">perbarui tabel dan ringkasan</tspan>
  </text>
  <path d="M600 1642 L600 1670" class="line"/>
  <path d="M430 1701 L390 1701 L390 801 L455 801" class="line"/>
  <text x="405" y="1689" class="label">Perbarui tampilan</text>

  <rect x="835" y="1490" width="260" height="58" rx="12" class="error"/>
  <text x="965" y="1526" text-anchor="middle" font-size="16" font-weight="600">Perbaiki data atau coba lagi</text>
  <path d="M965 1448 L965 1490" class="line"/>
  <path d="M835 1519 L810 1519 L810 1069 L738 1069" class="line"/>
  <text x="819" y="1508" class="label">Kembali ke formulir</text>
</svg>
