<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1320" viewBox="0 0 1000 1320" role="img" aria-labelledby="title description">
  <title id="title">Flowchart Pengujian API dengan Postman</title>
  <desc id="description">Alur menguji request tambah layanan yang tersimpan di collection Postman Ruang Laundry.</desc>
  <defs>
    <style>
      text { font-family: "Segoe UI", Arial, sans-serif; fill: #18332e; }
      .box { fill: #edf6f2; stroke: #426b62; stroke-width: 2; }
      .warn { fill: #fff3d8; stroke: #b1842e; stroke-width: 2; }
      .error { fill: #fff0ed; stroke: #bd6655; stroke-width: 2; }
      .term { fill: #173c34; stroke: #173c34; stroke-width: 2; }
      .termtext { fill: white; font-weight: 700; }
      .line { fill: none; stroke: #526e67; stroke-width: 2.2; marker-end: url(#arrow); }
      .label { font-size: 15px; fill: #526e67; font-weight: 600; }
      .small { font-size: 15px; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#526e67"/>
    </marker>
  </defs>
  <text x="500" y="42" text-anchor="middle" font-size="27" font-weight="700">Flowchart Pengujian API dengan Postman</text>

  <ellipse cx="500" cy="100" rx="90" ry="28" class="term"/>
  <text x="500" y="106" text-anchor="middle" class="termtext" font-size="16">Mulai</text>

  <rect x="320" y="155" width="360" height="62" rx="12" class="box"/>
  <text x="500" y="192" text-anchor="middle" font-size="17" font-weight="600">Jalankan server Ruang Laundry</text>
  <path d="M500 128 L500 155" class="line"/>

  <rect x="320" y="247" width="360" height="72" rx="12" class="box"/>
  <text x="500" y="275" text-anchor="middle" font-size="17" font-weight="600">
    <tspan x="500">Buka request layanan di Postman</tspan>
    <tspan x="500" dy="24" class="small">POST /api/laundry/services</tspan>
  </text>
  <path d="M500 217 L500 247" class="line"/>

  <rect x="280" y="349" width="440" height="92" rx="12" class="warn"/>
  <text x="500" y="377" text-anchor="middle" font-size="16" font-weight="600">
    <tspan x="500">Periksa URL dan body JSON</tspan>
    <tspan x="500" dy="23" class="small">Gunakan price_per_kg (bukan price)</tspan>
    <tspan x="500" dy="21" class="small">Body request di collection perlu disesuaikan</tspan>
  </text>
  <path d="M500 319 L500 349" class="line"/>

  <rect x="320" y="471" width="360" height="64" rx="12" class="box"/>
  <text x="500" y="509" text-anchor="middle" font-size="17" font-weight="600">Klik Send</text>
  <path d="M500 441 L500 471" class="line"/>

  <rect x="320" y="565" width="360" height="74" rx="12" class="box"/>
  <text x="500" y="593" text-anchor="middle" font-size="17" font-weight="600">
    <tspan x="500">Server menerima dan memvalidasi</tspan>
    <tspan x="500" dy="24" class="small">permintaan API</tspan>
  </text>
  <path d="M500 535 L500 565" class="line"/>

  <polygon points="500,665 600,720 500,775 400,720" class="warn"/>
  <text x="500" y="726" text-anchor="middle" font-size="16" font-weight="600">Data valid?</text>
  <path d="M500 639 L500 665" class="line"/>

  <rect x="55" y="688" width="255" height="68" rx="12" class="error"/>
  <text x="182" y="716" text-anchor="middle" font-size="16" font-weight="600">
    <tspan x="182">Postman menampilkan</tspan><tspan x="182" dy="22" class="small">respons error (400/500)</tspan>
  </text>
  <path d="M400 720 L310 720" class="line"/>
  <text x="337" y="704" class="label">Tidak</text>
  <path d="M182 688 L182 395 L280 395" class="line"/>
  <text x="194" y="672" class="label">Perbaiki request</text>

  <rect x="320" y="815" width="360" height="68" rx="12" class="box"/>
  <text x="500" y="843" text-anchor="middle" font-size="16" font-weight="600">
    <tspan x="500">Simpan data layanan</tspan><tspan x="500" dy="22" class="small">ke basis data SQLite</tspan>
  </text>
  <path d="M500 775 L500 815" class="line"/>
  <text x="515" y="800" class="label">Ya</text>

  <rect x="320" y="913" width="360" height="70" rx="12" class="box"/>
  <text x="500" y="941" text-anchor="middle" font-size="16" font-weight="600">
    <tspan x="500">API mengirim respons JSON</tspan><tspan x="500" dy="22" class="small">berhasil dan data layanan</tspan>
  </text>
  <path d="M500 883 L500 913" class="line"/>

  <rect x="320" y="1013" width="360" height="68" rx="12" class="box"/>
  <text x="500" y="1041" text-anchor="middle" font-size="16" font-weight="600">
    <tspan x="500">Periksa status dan isi respons</tspan><tspan x="500" dy="22" class="small">di Postman</tspan>
  </text>
  <path d="M500 983 L500 1013" class="line"/>

  <ellipse cx="500" cy="1150" rx="110" ry="32" class="term"/>
  <text x="500" y="1156" text-anchor="middle" class="termtext" font-size="16">Selesai</text>
  <path d="M500 1081 L500 1118" class="line"/>

  <text x="500" y="1230" text-anchor="middle" class="small" fill="#5b706a">
    <tspan x="500">Catatan: collection yang ada saat ini berisi satu request tambah layanan.</tspan>
    <tspan x="500" dy="22">Contoh body yang sesuai memerlukan name dan price_per_kg.</tspan>
  </text>
</svg>
